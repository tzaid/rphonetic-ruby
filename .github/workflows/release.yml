name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Check release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ruby -r ./lib/rphonetic/version -e 'abort "Tag must match v#{RPhonetic::VERSION}" unless ENV.fetch("RELEASE_TAG") == "v#{RPhonetic::VERSION}"'

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-22.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: actions/download-artifact@v8
        with:
          pattern: gem-*
          path: pkg
          merge-multiple: true
      - name: Verify release packages
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ruby script/verify_release.rb
      - name: Authenticate to RubyGems
        uses: rubygems/configure-rubygems-credentials@8674aee7f9f9055a8b771794d6f1e66b5fad36a9
      - name: Publish tested packages
        run: |
          for gem in pkg/*.gem; do
            gem push "$gem" --host https://rubygems.org
          done
